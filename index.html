<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>HK Real Circuit｜Central・灣仔封閉賽道</title><style>*{box-sizing:border-box}html,body{margin:0;background:#060914;color:#e8f7ff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;background:#08101e}#menu,#hud,#touch{position:fixed;z-index:2}#menu{inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#070b18dd,#071f35dd)}.card{width:min(92vw,560px);padding:26px;border:1px solid #36d9ff66;border-radius:22px;background:#091426ee;box-shadow:0 0 60px #00c8ff22}h1{margin:0 0 5px;color:#58e5ff;letter-spacing:.04em}p{color:#a8c4d3}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:16px 0}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip,button{border:1px solid #42cfff66;background:#10253a;color:#dff8ff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.chip.on,button.primary{background:#00a8d8;color:#03121b;border-color:#6ceaff}.start{width:100%;font-size:1.1rem;margin-top:10px}#hud{top:15px;left:15px;right:15px;display:none;justify-content:space-between;text-shadow:0 2px 4px #000;font-weight:800}#msg{position:fixed;inset:0;display:none;place-items:center;font-size:clamp(2rem,8vw,5rem);color:#fff;text-shadow:0 0 22px #00d9ff;text-align:center;pointer-events:none}#touch{display:none;bottom:18px;left:18px;right:18px;justify-content:space-between;pointer-events:none}.touchgrp{display:flex;gap:10px}.touchgrp button{pointer-events:auto;border-radius:50%;width:58px;height:58px;background:#0a1c2dcc}.help{font-size:.85rem;color:#91b2c3;line-height:1.6}@media(max-width:700px){#touch{display:flex}.card{padding:20px}.help{font-size:.76rem}}</style></head><body><canvas id="game"></canvas><div id="menu"><div class="card"><h1>HK REAL CIRCUIT</h1><p>Central・灣仔真實道路布局遊戲化封閉賽道</p><div class="row"><b>電腦對手</b><div class="chips" id="opps"></div></div><div class="row"><b>駕駛輔助</b><div class="chips" id="assist"></div></div><div class="row"><b>模式</b><div class="chips" id="mode"><button class="chip on" data-v="race">3圈 Grand Prix</button><button class="chip" data-v="time">Time Trial</button></div></div><button class="primary start" id="start">開始比賽</button><div class="help">賽道：中環干諾道中 → 灣仔告士打道 → 銅鑼灣海旁 → 軒尼詩道（遊戲化封閉路線）<br>W/↑ 加速　S/↓ 煞車　A/D 轉向　Space Boost　L Lifting Turn　C 視角　P 暫停<br>手機可用下方觸控按鈕。對手只競速，不攻擊。</div></div></div><div id="hud"><span id="lap">LAP 1/3</span><span id="sector">SECTOR 1</span><span id="speed">0 km/h</span><span id="assistHud">ASSIST HIGH</span><span id="time">00:00.0</span></div><div id="msg"></div><div id="touch"><div class="touchgrp"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="touchgrp"><button data-key="brake">B</button><button data-key="gas">▲</button><button data-key="boost">⚡</button></div></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,run=false,paused=false,mode='race',opp=4,assist='high',t=0,last=0,keys={},player,ais=[],road=[],cam=0;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function chips(id,vals,def,cb){let el=document.querySelector(id);vals.forEach(v=>{let b=document.createElement('button');b.className='chip'+(v===def?' on':'');b.textContent=typeof v==='number'?(v===0?'無':v+'架'):v.toUpperCase();b.onclick=()=>{el.querySelectorAll('.chip').forEach(z=>z.classList.remove('on'));b.classList.add('on');cb(v)};el.append(b)})}chips('#opps',[0,1,2,3,4,5,6,7],4,v=>opp=v);chips('#assist',['off','low','high'],'high',v=>assist=v);document.querySelectorAll('#mode .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mode .chip').forEach(z=>z.classList.remove('on'));b.classList.add('on');mode=b.dataset.v});
function mkRoad(){road=[];for(let i=0;i<900;i++){let z=i/899;road.push({x:Math.sin(z*12)*120+Math.sin(z*27)*45,y:Math.cos(z*9)*50+Math.sin(z*19)*30,w:260+Math.sin(z*8)*35})}}function start(){mkRoad();player={d:0,lane:0,v:0};ais=Array.from({length:opp},(_,i)=>({d:-35-i*25,lane:(i%3-1)*.42,v:95+i*3}));t=0;run=true;paused=false;document.querySelector('#menu').style.display='none';document.querySelector('#hud').style.display='flex';show('GO!',700);requestAnimationFrame(loop)}document.querySelector('#start').onclick=start;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='p')paused=!paused;if(e.key.toLowerCase()==='c')cam=1-cam});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelectorAll('#touch button').forEach(b=>{let k=b.dataset.key;b.onpointerdown=()=>keys[k]=1;b.onpointerup=()=>keys[k]=0;b.onpointercancel=()=>keys[k]=0});
function show(s,ms=0){let m=document.querySelector('#msg');m.textContent=s;m.style.display='grid';if(ms)setTimeout(()=>m.style.display='none',ms)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.05);last=now;if(!paused){t+=dt;let gas=keys.w||keys.arrowup||keys.gas,brake=keys.s||keys.arrowdown||keys.brake,turn=(keys.a||keys.arrowleft||keys.left?-1:0)+(keys.d||keys.arrowright||keys.right?1:0),lift=keys.l;player.v+=((gas?145:0)-(brake?220:0)-player.v*.45)*dt;if(keys[' ']||keys.boost)player.v+=180*dt;player.v=clamp(player.v,0,245);let grip=lift?.72:1;player.lane=clamp(player.lane+turn*dt*(1.7+player.v/120)*grip,-1,1);if(assist==='high'){player.lane*=.985;if(Math.abs(player.lane)>.88)player.lane*=.97}player.d+=player.v*dt;ais.forEach(a=>{a.d+=(a.v+Math.sin(t+a.d)*5)*dt;a.lane+=Math.sin(t*.7+a.d)*dt*.12});draw();updateHud()}else draw();requestAnimationFrame(loop)}
function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#071426');sky.addColorStop(1,'#1c6b87');x.fillStyle=sky;x.fillRect(0,0,W,H*.58);x.fillStyle='#06101b';x.fillRect(0,H*.58,W,H*.42);let horizon=H*.58;for(let i=0;i<35;i++){let bx=(i*97+t*.02)%W;let bh=25+(i*41)%130;x.fillStyle=i%3?'#122c42':'#1b5061';x.fillRect(bx,horizon-bh,35,bh);if(i%4===0){x.fillStyle='#54e9ff99';for(let q=0;q<4;q++)x.fillRect(bx+7+q*7,horizon-bh+15,3,5)}}let cx=W/2+(cam?player.lane*80:0);x.fillStyle='#182b3a';x.beginPath();x.moveTo(0,H);x.lineTo(cx-210,horizon);x.lineTo(cx+210,horizon);x.lineTo(W,H);x.fill();for(let i=0;i<14;i++){let p=i/14,yy=horizon+(H-horizon)*p*p,ww=30+p*500;x.strokeStyle='#49d8e766';x.lineWidth=2;x.beginPath();x.moveTo(cx-ww/2,yy);x.lineTo(cx+ww/2,yy);x.stroke()}let sorted=[...ais].sort((a,b)=>b.d-player.d);sorted.forEach(a=>{let rel=a.d-player.d;if(rel>-500&&rel<900){let p=.15+(.85-(rel+500)/1400)*.72;let yy=horizon+(H-horizon)*p*p;let xx=cx+a.lane*(90+p*150);car(xx,yy,18+p*18,25+p*30,'#ff477e')}});car(cx+player.lane*150,H*.78,34,58,'#44e9ff');}
function car(xx,yy,w,h,col){x.save();x.translate(xx,yy);x.fillStyle='#07101c';x.fillRect(-w*.65,-h*.35,w*.18,h*.7);x.fillRect(w*.47,-h*.35,w*.18,h*.7);x.fillStyle=col;x.beginPath();x.moveTo(-w*.45,h*.5);x.lineTo(-w*.65,-h*.15);x.lineTo(-w*.3,-h*.5);x.lineTo(w*.3,-h*.5);x.lineTo(w*.65,-h*.15);x.lineTo(w*.45,h*.5);x.closePath();x.fill();x.fillStyle='#d8fbff';x.fillRect(-w*.25,-h*.28,w*.5,h*.14);x.restore()}
function updateHud(){document.querySelector('#speed').textContent=Math.round(player.v*1.15)+' km/h';document.querySelector('#lap').textContent=mode==='time'?'TIME TRIAL':'LAP '+(Math.min(3,Math.floor(player.d/3000)+1))+'/3';document.querySelector('#assistHud').textContent='ASSIST '+assist.toUpperCase();document.querySelector('#time').textContent=(t/60|0)+':'+(t%60).toFixed(1).padStart(4,'0');document.querySelector('#sector').textContent=player.d<3000?'SECTOR 1 · CENTRAL':player.d<6000?'SECTOR 2 · WAN CHAI':'SECTOR 3 · CAUSEWAY BAY';if(mode==='race'&&player.d>=9000){run=false;show('FINISH! '+document.querySelector('#time').textContent)}}
</script></body></html>
