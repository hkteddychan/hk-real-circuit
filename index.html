<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HK Real Circuit 3D｜Central・灣仔真實地貌</title><script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js"></script><link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui;background:#07111c}.panel{position:fixed;z-index:5;top:16px;left:16px;width:min(370px,calc(100vw - 32px));padding:18px;border:1px solid #52dcff88;border-radius:16px;background:#071526dd;color:#e9faff;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0008}.panel h1{margin:0;color:#72eaff;font-size:1.2rem}.panel p{font-size:.85rem;color:#b7d3dd;line-height:1.45}.status{margin:12px 0;padding:10px;border-radius:9px;background:#102c3a;color:#8ceeff;font-size:.8rem}.row{display:flex;gap:8px;margin-top:10px}button{flex:1;padding:10px;border:1px solid #42cfff77;border-radius:9px;background:#10314a;color:#e9faff;font-weight:700;cursor:pointer}button:hover{background:#17627d}.credit{font-size:.68rem;color:#8aaebb;margin-top:11px;line-height:1.35}.cesium-viewer-bottom{display:none}</style></head><body><div id="cesiumContainer"></div><section class="panel"><h1>HK REAL CIRCUIT 3D</h1><p>真實香港地貌測試版｜Central・灣仔</p><div class="status" id="status">正在載入香港政府 3D Buildings / Infrastructure…</div><div class="row"><button id="central">Central</button><button id="wan">Wan Chai</button><button id="cb">Causeway Bay</button></div><div class="row"><button id="tilt">切換 3D 視角</button><button id="reset">重設視角</button></div><div class="credit">資料：香港特別行政區政府地政總署 CSDI 3D Spatial Data API。呢個版本先驗證真實 3D 地貌及城市模型，賽車物理會接入下一版。</div></section><script>
Cesium.Ion.defaultAccessToken='';const status=document.getElementById('status');const viewer=new Cesium.Viewer('cesiumContainer',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:true,infoBox:false,selectionIndicator:false,shouldAnimate:true});viewer.scene.globe.show=true;viewer.scene.globe.depthTestAgainstTerrain=false;const KEY='3967f8f365694e0798af3e7678509421';const base='https://data.map.gov.hk/api/3d-data/3dsd/WGS84/';let heading=0.02,pitch=-0.72,range=4300;async function add(url,label){try{const tiles=await Cesium.Cesium3DTileset.fromUrl(url);viewer.scene.primitives.add(tiles);status.textContent+=' '+label+' ✅';return tiles}catch(e){status.textContent+=' '+label+' ❌';console.error(e)}}async function init(){await Promise.all([add(base+'building/tileset.json?key='+KEY,'Buildings'),add(base+'infrastructure/tileset.json?key='+KEY,'Infrastructure')]);status.textContent='香港政府真實 3D 城市模型已載入 ✅';fly(114.1588,22.2816,range)}function fly(lon,lat,r=range){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,r),orientation:{heading,pitch,roll:0},duration:1.2})}document.getElementById('central').onclick=()=>fly(114.1588,22.2816,3500);document.getElementById('wan').onclick=()=>fly(114.1722,22.2769,3000);document.getElementById('cb').onclick=()=>fly(114.1847,22.2800,2600);document.getElementById('reset').onclick=()=>fly(114.1588,22.2816,4300);document.getElementById('tilt').onclick=()=>{pitch=pitch>-1?-1.15:-.72;fly(114.1588,22.2816,range)};init();</script></body></html>
