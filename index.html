<script>
window.__errs=[];window.addEventListener('error',e=>__errs.push('err:'+e.message));window.addEventListener('unhandledrejection',e=>__errs.push('rej:'+(e.reason&&e.reason.message||e.reason)));window.addEventListener('error',e=>{e.preventDefault&&e.preventDefault()},true);
Cesium.Ion.defaultAccessToken='';
const container=document.getElementById('cesiumContainer');
const viewer=new Cesium.Viewer(container,{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,shouldAnimate:true});
viewer.scene.globe.show=true;viewer.scene.globe.depthTestAgainstTerrain=false;viewer.scene.globe.showGroundAtmosphere=false;
const KEY='3967f8f365694e0798af3e7678509421';
const BASE='https://data.map.gov.hk/api/3d-data/3dsd/WGS84/';
let heading=0.02,pitch=-0.72,range=4300;
async function addTiles(url,label){
 try{
  const t=await Promise.race([
   Cesium.Cesium3DTileset.fromUrl(url,{maximumScreenSpaceError:32,skipLevelOfDetail:true,preloadFlightDepth:false}),
   new Promise((_,rej)=>setTimeout(()=>rej(new Error('tile timeout '+label)),12000))
  ]);
  viewer.scene.primitives.add(t);
  t.tileCacheSize=256;
  return t;
 }catch(e){console.error(label,e);return null}
}
async function init(){await Promise.all([addTiles(BASE+'building/tileset.json?key='+KEY,'B'),addTiles(BASE+'infrastructure/tileset.json?key='+KEY,'I')]);fly(114.1588,22.2816,3800);buildTrackVisuals();drawRoadDashes();}
// Slightly higher and forward — so the player can see the road ahead
function fly(lon,lat,r){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,r),orientation:{heading,pitch,roll:0},duration:1.2})}
let startCamSet=false;
function setStartCam(){
 if(startCamSet)return;startCamSet=true;
 const sp=ROUTE[0],n=ROUTE[1];
 const th=Math.atan2(n[1]-sp[1],n[0]-sp[0]);
 // place camera 60m behind start, 50m up, looking along the track
 const back=Math.PI;
 const camLon=sp[0]+Math.cos(back+th)*0.0003, camLat=sp[1]+Math.sin(back+th)*0.0003;
 viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(camLon,camLat,55),
  orientation:{heading:th,pitch:-0.18,roll:0}});
}
// Real HK Formula E Central Harbourfront Circuit (2016-2019, 1.86km, 10 turns, clockwise)
// 25 waypoints from OSM street centerlines — Lung Wo Rd main straight (555m) → T1 hairpin →
// Star Ferry T2 hairpin → T3/T4 chicane → T5 Yiu Sing roundabout → Man Yiu St → T8/T9 → T10 back to S/F
const ROUTE=[
[114.16178,22.283228],[114.1621,22.28315],[114.1624,22.2831],[114.1627,22.283],[114.163,22.2829],[114.1633,22.2828],[114.1637,22.2827],[114.164263,22.282627],[114.164879,22.282523],[114.1644,22.282],[114.1636,22.2817],[114.1625,22.28155],[114.1617,22.2819],[114.1614,22.2825],[114.16115,22.283],[114.161,22.2837],[114.1609,22.2843],[114.1614,22.285],[114.161,22.28515],[114.1604,22.28525],[114.159693,22.284859],[114.159457,22.2845],[114.1597,22.284],[114.1605,22.2835],[114.16178,22.283228]
];
const ROUTE_REF=ROUTE.map(p=>Cesium.Cartesian3.fromDegrees(p[0],p[1],0));
const TOT=ROUTE.length-1;
// Sector boundaries (TOT=24 segments): S1 = main straight + T1 (segs 0-7), S2 = T2 hairpin + chicane (8-15), S3 = roundabout + back straight + T9/T10 (16-23)
const SECTOR_BOUNDS=[8,16,24];
// Pit lane at T9→T10 (outside of T9 90° right, before the long T10 sweep back to S/F) — segment 23 (WP24→WP25)
const PIT_SEG_START=23;
const PIT_SEG_END=24;
const PIT_LATERAL=0.0008; // perpendicular distance from track centerline for pit
const PIT_HALF_WIDTH=0.0009;
const PIT_SPEED_LIMIT=60;
const ROAD_HALF_WIDTH=0.0011;
// Build visual track primitives: centerline, two dashed sidelines, start/finish gate, pit rectangle
const trackEntities=[];
let liftBrakeT=0,liftBoostT=0;
function triggerLift(){if(!game||game.countdown||game.finished)return;if(liftBrakeT>0||liftBoostT>0)return;if(!game.player||game.player.speed<30)return;liftBrakeT=1.0;setMsg('LIFT');setTimeout(()=>setMsg(''),600);}
window.__lift=()=>({brake:liftBrakeT,boost:liftBoostT});
window.__camFov=()=>viewer.camera.frustum.fov;
window.__polyCount=()=>viewer.entities.values.filter(e=>e.polyline).length;
function offsetPoint(lon,lat,perpDist){
 // approximate perpendicular offset in degrees using local lat scaling
 const dLon=Math.cos(perpDist);const dLat=Math.sin(perpDist);
 return [lon+dLon,lat+dLat];
}
function buildTrackVisuals(){
 for(const e of trackEntities){try{viewer.entities.remove(e);}catch(_){}}
 trackEntities.length=0;
 // 1) Centerline — cyan polyline along ROUTE at slight height for visibility
 trackEntities.push(viewer.entities.add({
  polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights(
   ROUTE.flatMap(p=>[p[0],p[1],1.5])),
   width:6,material:Cesium.Color.fromCssColorString('#52dcff').withAlpha(0.85),
   clampToGround:false}}));
 // 2) Side dashed lines — two polylines offset perpendicular by ±ROAD_HALF_WIDTH deg
 for(const sign of [-1,1]){
  const pts=[];
  for(let i=0;i<ROUTE.length;i++){
   const p=ROUTE[i];
   const a=ROUTE[Math.max(0,i-1)];
   const b=ROUTE[Math.min(ROUTE.length-1,i+1)];
   const th=Math.atan2(b[1]-a[1],b[0]-a[0]);
   const perp=th+Math.PI/2;
   pts.push([p[0]+Math.cos(perp)*sign*ROAD_HALF_WIDTH, p[1]+Math.sin(perp)*sign*ROAD_HALF_WIDTH]);
  }
  trackEntities.push(viewer.entities.add({
   polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights(pts.flatMap(p=>[p[0],p[1],1.2])),
    width:2,material:new Cesium.PolylineDashMaterialProperty({color:Cesium.Color.WHITE.withAlpha(0.85),dashLength:8}),
    clampToGround:false}}));
 }
 // 3) Start/Finish gate — black/white checker across track at ROUTE[0] perpendicular
 const start=ROUTE[0],next=ROUTE[1];
 const sTh=Math.atan2(next[1]-start[1],next[0]-start[0]);
 const sPerp=sTh+Math.PI/2;
 const sL=[start[0]+Math.cos(sPerp)*ROAD_HALF_WIDTH*1.4, start[1]+Math.sin(sPerp)*ROAD_HALF_WIDTH*1.4];
 const sR=[start[0]-Math.cos(sPerp)*ROAD_HALF_WIDTH*1.4, start[1]-Math.sin(sPerp)*ROAD_HALF_WIDTH*1.4];
 const segs=8;
 for(let i=0;i<segs;i++){
  const t0=i/segs,t1=(i+1)/segs;
  const lon0=sL[0]+(sR[0]-sL[0])*t0, lat0=sL[1]+(sR[1]-sL[1])*t0;
  const lon1=sL[0]+(sR[0]-sL[0])*t1, lat1=sL[1]+(sR[1]-sL[1])*t1;
  const col=(i%2===0)?Cesium.Color.BLACK:Cesium.Color.WHITE;
  trackEntities.push(viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights([lon0,lat0,2.05,lon1,lat1,2.05]),width:5,material:col.withAlpha(0.95)}}));
 }
 // 4) Pit lane rectangle — alongside segment ROUTE[2]->ROUTE[3] (114.1685,22.2788 -> 114.1722,22.2769)
 const pa=ROUTE[PIT_SEG_START],pb=ROUTE[PIT_SEG_END];
 const pTh=Math.atan2(pb[1]-pa[1],pb[0]-pa[0]);
 const pPerp=pTh+Math.PI/2;
 const corners=[
  [pa[0],                                     pa[1]],
  [pb[0],                                     pb[1]],
  [pb[0]+Math.cos(pPerp)*PIT_LATERAL*1.6,     pb[1]+Math.sin(pPerp)*PIT_LATERAL*1.6],
  [pa[0]+Math.cos(pPerp)*PIT_LATERAL*1.6,     pa[1]+Math.sin(pPerp)*PIT_LATERAL*1.6]
 ];
 trackEntities.push(viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights(corners.flatMap(c=>[c[0],c[1],0.8])),width:3,material:Cesium.Color.fromCssColorString('#7fff7f').withAlpha(0.9),clampToGround:false}}));
 trackEntities.push(viewer.entities.add({polygon:{hierarchy:Cesium.Cartesian3.fromDegreesArray(corners.flatMap(c=>[c[0],c[1]])),
  material:Cesium.Color.fromCssColorString('#1aff5a').withAlpha(0.25),height:0.6}}));
 const mid=[(pa[0]+pb[0])/2+Math.cos(pPerp)*PIT_LATERAL*0.8, (pa[1]+pb[1])/2+Math.sin(pPerp)*PIT_LATERAL*0.8];
 trackEntities.push(viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(mid[0],mid[1],25),
  label:{text:'PIT LANE',font:'bold 14px sans-serif',fillColor:Cesium.Color.fromCssColorString('#7fff7f'),
   outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,disableDepthTestDistance:Number.POSITIVE_INFINITY}}));
 const midSeg=[(pa[0]+pb[0])/2,(pa[1]+pb[1])/2];
 trackEntities.push(viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(midSeg[0]+Math.cos(pPerp)*PIT_LATERAL*0.8,midSeg[1]+Math.sin(pPerp)*PIT_LATERAL*0.8,12),
  label:{text:'⚠ 60',font:'12px sans-serif',fillColor:Cesium.Color.fromCssColorString('#ffd27a'),
   outlineColor:Cesium.Color.BLACK,outlineWidth:2,style:Cesium.LabelStyle.FILL_AND_OUTLINE,disableDepthTestDistance:Number.POSITIVE_INFINITY}}));
}

// Race state
let game=null;
function resetGame(aiCount,totalLaps,assist,camMode){
 liftBrakeT=0;liftBoostT=0;
 viewer.camera.frustum.fov=Math.PI/3;
 const st={cars:[],player:null,started:false,countdown:0,countT:0,raceTime:0,laps:totalLaps,assist,camMode,finished:false,
  sector:1,lastSector:1,secT:0,sectorTimes:[0,0,0],sectorActive:false,sectorFlash:0,
  lapStart:0,lastLap:0,lastLapCount:0,best:0,lapFlash:0,
  pitActive:false,inPit:false};
 st.player=makeCar('Player',Cesium.Color.ORANGE,0,true);
 for(let i=0;i<aiCount;i++){st.cars.push(makeCar('AI'+(i+1),Cesium.Color.fromHsl((i*0.21)%1,0.8,0.5),i+1,false));}
 st.cars.push(st.player);
 return st;
}
function makeCar(name,color,offset,isPlayer){
 const pos=Cesium.Cartesian3.fromDegrees(ROUTE[0][0],ROUTE[0][1],3);
 const e=viewer.entities.add({
  name,
  position:pos,
  orientation:Cesium.Quaternion.IDENTITY,
  box:{dimensions:new Cesium.Cartesian3(2.2,5.0,1.3),material:color.withAlpha(0.95),outline:true,outlineColor:Cesium.Color.WHITE},

function segHeading(i){const a=ROUTE[i],b=ROUTE[i+1];return Math.atan2(b[1]-a[1],b[0]-a[0]);}
function routePos(p){
 const seg=Math.floor(p)%TOT;const f=p-Math.floor(p);
 const a=ROUTE[seg],b=ROUTE[seg+1];
 return {lon:a[0]+(b[0]-a[0])*f,lat:a[1]+(b[1]-a[1])*f,seg,f};

function trackHeading(p){return segHeading(Math.floor(p)%TOT);}
function getSector(p){const seg=Math.floor(p)%TOT;if(seg<8)return 1;if(seg<16)return 2;return 3;}
function isInPit(p,lateral){

function distToRoute(lon,lat){
 let best=1e9;

  const dx=b[0]-a[0],dy=b[1]-a[1];const t=Math.max(0,Math.min(1,((lon-a[0])*dx+(lat-a[1])*dy)/(dx*dx+dy*dy)));

let mmCtx=null;
function renderMinimap(){

  const c=document.getElementById('mmCanvas');
  if(!c)return;mmCtx=c.getContext('2d');
 }
 if(!mmCtx||!game)return;
 const c=document.getElementById('mmCanvas');
 const W=c.width,H=c.height;
 // compute bbox of ROUTE (loose padding)
 let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
 for(const p of ROUTE){if(p[0]<minLon)minLon=p[0];if(p[0]>maxLon)maxLon=p[0];if(p[1]<minLat)minLat=p[1];if(p[1]>maxLat)maxLat=p[1];}
 const padLon=(maxLon-minLon)*0.15,padLat=(maxLat-minLat)*0.15;
 minLon-=padLon;maxLon+=padLon;minLat-=padLat;maxLat+=padLat;
 const sx=W/(maxLon-minLon),sy=H/(maxLat-minLat);
 // clear
 mmCtx.fillStyle='#071526';mmCtx.fillRect(0,0,W,H);
 // grid
 mmCtx.strokeStyle='#10314a';mmCtx.lineWidth=1;
 for(let i=0;i<=6;i++){mmCtx.beginPath();mmCtx.moveTo(i*W/6,0);mmCtx.lineTo(i*W/6,H);mmCtx.stroke();}
 for(let i=0;i<=6;i++){mmCtx.beginPath();mmCtx.moveTo(0,i*H/6);mmCtx.lineTo(W,i*H/6);mmCtx.stroke();}
 // route
 mmCtx.strokeStyle='#52dcff';mmCtx.lineWidth=4;mmCtx.lineCap='round';mmCtx.lineJoin='round';
 mmCtx.beginPath();
 for(let i=0;i<ROUTE.length;i++){
  const p=ROUTE[i];
  const x=(p[0]-minLon)*sx, y=H-(p[1]-minLat)*sy;
  if(i===0)mmCtx.moveTo(x,y); else mmCtx.lineTo(x,y);
 }
 mmCtx.closePath();mmCtx.stroke();
 // start/finish
 const s=ROUTE[0];
 mmCtx.fillStyle='#fff';mmCtx.fillRect((s[0]-minLon)*sx-6,H-(s[1]-minLat)*sy-6,12,12);
 mmCtx.strokeStyle='#000';mmCtx.lineWidth=2;mmCtx.strokeRect((s[0]-minLon)*sx-6,H-(s[1]-minLat)*sy-6,12,12);
 // pit
 const pa=ROUTE[PIT_SEG_START],pb=ROUTE[PIT_SEG_END];
 mmCtx.fillStyle='rgba(127,255,127,0.5)';
 mmCtx.fillRect(Math.min((pa[0]-minLon)*sx,(pb[0]-minLon)*sx)-3, H-Math.max((pa[1]-minLat)*sy,(pb[1]-minLat)*sy)-3, Math.abs((pb[0]-pa[0])*sx)+6, Math.abs((pb[1]-pa[1])*sy)+6);
 // cars (AI first, then player on top)
 for(const car of game.cars){
  const rp=routePos(car.progress);
  const x=(rp.lon+Math.cos(trackHeading(car.progress)+Math.PI/2)*car.lateral-minLon)*sx;
  const y=H-(rp.lat+Math.sin(trackHeading(car.progress)+Math.PI/2)*car.lateral-minLat)*sy;
  if(car.isPlayer){mmCtx.fillStyle='#ffa030';mmCtx.strokeStyle='#000';mmCtx.lineWidth=2;
   mmCtx.beginPath();mmCtx.arc(x,y,8,0,Math.PI*2);mmCtx.fill();mmCtx.stroke();
   // heading arrow
   const h=car.heading; const len=14;
   mmCtx.strokeStyle='#ffa030';mmCtx.lineWidth=2;
   mmCtx.beginPath();mmCtx.moveTo(x,y);mmCtx.lineTo(x+Math.cos(h)*len,y-Math.sin(h)*len);mmCtx.stroke();
  } else {
   const c=car.color;
   const r=Math.round((c.red||0)*255),g=Math.round((c.green||0)*255),b=Math.round((c.blue||0)*255);
   mmCtx.fillStyle=`rgb(${r},${g},${b})`;mmCtx.strokeStyle='#000';mmCtx.lineWidth=1;
   mmCtx.beginPath();mmCtx.arc(x,y,5,0,Math.PI*2);mmCtx.fill();mmCtx.stroke();
  }
 }
 // label "YOU" near player
 if(game.player){
  const rp=routePos(game.player.progress);
  const x=(rp.lon-minLon)*sx, y=H-(rp.lat-minLat)*sy;
  mmCtx.fillStyle='#ffa030';mmCtx.font='bold 11px sans-serif';mmCtx.textAlign='left';
  mmCtx.fillText('YOU',x+10,y+4);
 }
}

// Simulation
function update(dt){
 if(!game||game.finished)return;
 const st=game;
 if(st.countdown>0){return;}
 const p=st.player;
 st.raceTime+=dt;
 const gas=keys.w||keys['arrowup']||keys.dG;
 const brk=keys.s||keys['arrowdown']||keys.dB;
 const turn=(keys.a||keys.dL?-1:0)+(keys.d||keys.dR?1:0);
 // ---- Arcade physics: track-follow progress + lateral offset + heading ----
 const maxSpeed=200,accel=240,brake=85,drag=0.16;
 // Lifting Turn timers
 if(liftBrakeT>0){liftBrakeT=Math.max(0,liftBrakeT-dt);if(liftBrakeT===0)liftBoostT=2.0;}
 if(liftBoostT>0)liftBoostT=Math.max(0,liftBoostT-dt);
 let targetHeading=trackHeading(p.progress);
 // assist: High = auto-steer + auto-brake; Low = light pull to track
 if(st.assist==='High'){
  p.heading=targetHeading;
  p.lateral*=0.6;
 } else if(st.assist==='Low'){
  p.heading+=angleDiff(p.heading,targetHeading)*Math.min(1,4*dt);
  p.lateral*=0.85;
 }
 // manual steering (heading in radians): low-speed responsive, high-speed greatly reduced
 const spdAbs=Math.abs(p.speed);
 const turnRate=2.6/(1+Math.pow(spdAbs/70,1.6));
 const liftTurnBoost=liftBrakeT>0?1.8:1.0;
 if(st.assist!=='High'){p.heading+=turn*turnRate*liftTurnBoost*dt;}
 // throttle/brake with Lifting Turn auto-deceleration and boost
 let effAccel=gas?accel:0;
 let effBrake=brk?brake:0;
 if(liftBrakeT>0){
  effBrake=Math.max(effBrake,brake*0.95);
  effAccel=0;
 }
 const liftBoost=liftBoostT>0?1.6:1.0;
 const speedUp=effAccel*liftBoost-effBrake;
 const dragF=drag*p.speed*(p.speed/maxSpeed)/maxSpeed;
 p.speed=Math.max(0,Math.min(maxSpeed,p.speed+speedUp*dt-dragF*dt));
 // heading vs track -> lateral drift
 const dh=angleDiff(p.heading,targetHeading);
 p.lateral+=Math.sin(dh)*p.speed*0.0000016*dt;
 // off-track (lateral beyond half road width ~ 0.001 deg) -> slow + pull back
 const off=Math.abs(p.lateral);
 if(off>0.0011){p.speed=Math.max(0,p.speed-160*dt);p.lateral*=0.9;}
 // pit lane — speed cap when player is laterally in pit zone
 st.inPit=isInPit(p.progress,p.lateral);
 if(st.inPit && p.speed>PIT_SPEED_LIMIT){p.speed=Math.max(0,p.speed-220*dt);}
 // advance along track
 p.progress+=((p.speed/maxSpeed)*dt)*2.4;
 // position = track point + perpendicular offset
 const rp=routePos(p.progress);
 const th=trackHeading(p.progress);
 const perp=th+Math.PI/2;
 const lon=rp.lon+Math.cos(perp)*p.lateral;
 const lat=rp.lat+Math.sin(perp)*p.lateral;
 p.e.position=Cesium.Cartesian3.fromDegrees(lon,lat,2.5);
 p.e.orientation=Cesium.Transforms.headingPitchRollQuaternion(p.e.position,new Cesium.HeadingPitchRoll(p.heading,0,0));
 // ---- sector timing ----
 const newSector=getSector(p.progress);
 if(newSector!==st.sector){
  if(st.sector>=1 && st.sector<=3){
   const idx=st.sector-1;
   if(st.secT>0){
    st.sectorTimes[idx]=st.secT;
    // sector flash: purple = overall best (S1 first lap), green = personal best, yellow = else
    const sf=document.getElementById('secFlash');
    const isBest=st.best===0?true:(st.secT<st.best);
    sf.className=(st.lastLap===0&&st.sector===1)?'purple':(isBest?'green':'yellow');
    sf.textContent=`S${st.sector} ${st.secT.toFixed(2)}s`;
    sf.style.display='block';
    setTimeout(()=>{sf.style.display='none';},1100);
   }
  }
  st.secT=0;st.sector=newSector;
 } else { st.secT+=dt; }
 // ---- lap detection (progress crosses integer*TOT) ----
 const curLap=Math.floor(p.progress/TOT);
 if(curLap>st.lastLapCount && curLap>=1){
  const lapT=st.raceTime-st.lapStart;
  st.lastLapCount=curLap;
  if(lapT>0 && lapT<600){st.lastLap=lapT;if(st.best===0||lapT<st.best)st.best=lapT;}
  setMsg(`🏁 LAP ${lapT.toFixed(2)}s`+ (st.best?` · BEST ${st.best.toFixed(2)}s`:''));
  setTimeout(()=>setMsg(''),1400);
  st.sectorTimes=[0,0,0];
  st.secT=0;st.lapStart=st.raceTime;
 }
 // player per-car lap record (for finish screen + AI)
 const newLapsDone=Math.min(st.laps,Math.max(0,Math.floor(p.progress/TOT)));
 if(newLapsDone>p.lapsDone){
  const lapTime=st.raceTime-p.lapStart;
  p.lapStart=st.raceTime;
  if(lapTime>0){
   p.lastLap=lapTime;
   if(p.best===0||lapTime<p.best)p.best=lapTime;
  }
  p.lapsDone=newLapsDone;
  if(p.lapsDone>=st.laps&&!p.finished){finishCar(p);}
 }
 if(p.progress>=st.laps*TOT&&!p.finished){finishCar(p);}
 // AI
 for(const c of st.cars){if(c.isPlayer||c.finished)continue;aiDrive(c,dt);}
 updateHUD();updateCamera(dt);renderMinimap();
}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function aiDrive(c,dt){
 const st=game;
 const sk=c.skill;
 // baseline max speed by skill (sk=0.7→115, sk=1.0→155); gentle per-car wobble
 const maxS=(105+sk*50)+Math.sin(c.offset*2.3)*12;
 const t=trackHeading(c.progress);c.heading=t;
 // curvature lookahead: look ~1.5 segments ahead, sum |heading delta|
 const baseSeg=Math.floor(c.progress)%TOT;
 const baseH=segHeading(baseSeg);
 let curv=0;
 for(let k=1;k<=3;k++){const i2=(baseSeg+k)%TOT;curv+=Math.abs(angleDiff(baseH,segHeading(i2)));}
 curv=curv/3;
 const corner=Math.min(1,curv/0.7);
 const brakeDist=0.12+0.08*(1-sk);
 const cornerSpeedFactor=Math.max(0.45,1-corner*(1.0-sk*0.45));
 // gap to player ahead on track
 let ahead=null,ga=1e9;
 for(const o of st.cars){if(o===c||o.finished)continue;let d=o.progress-c.progress;if(d<0)d+=TOT*1.2;if(d<ga){ga=d;ahead=o;}}
 let target=maxS*cornerSpeedFactor;
 // slipstream: 0.1~0.2 progress behind a faster car → +15%
 if(ga>0.1&&ga<0.22&&ahead&&ahead.speed>c.speed*1.05){target*=1.15;}
 // safety gap braking
 if(ga<0.18)target=Math.min(target,ga*maxS*7);
 // accelerate slower for rookies, faster for pros (out-of-corner exit)
 const accel=2.2+sk*1.8;
 c.speed=Math.max(0,c.speed+(target-c.speed)*Math.min(1,accel*dt));
 c.progress+=((c.speed/200)*dt)*2.4;
 const rp=routePos(c.progress);
 c.e.position=Cesium.Cartesian3.fromDegrees(rp.lon,rp.lat,2.5);
 c.e.orientation=Cesium.Transforms.headingPitchRollQuaternion(c.e.position,new Cesium.HeadingPitchRoll(c.heading,0,0));
 // lap detection (AI 都要識 finish)
 const newLapsDone=Math.min(st.laps,Math.max(0,Math.floor(c.progress/TOT)));
 if(newLapsDone>c.lapsDone){
  const lapTime=st.raceTime-c.lapStart;
  c.lapStart=st.raceTime;
  if(lapTime>0){
   c.lastLap=lapTime;
   if(c.best===0||lapTime<c.best)c.best=lapTime;
  }
  c.lapsDone=newLapsDone;
  if(c.lapsDone>=st.laps&&!c.finished){finishCar(c);}
 }
 if(c.progress>=st.laps*TOT&&!c.finished){finishCar(c);}
}
function finishCar(c){

 const order=game.cars.filter(x=>!x.finished).sort((a,b)=>b.progress-a.progress);
 const posIdx=order.indexOf(p)+1;
 document.getElementById('posBig').textContent=posIdx;
 const gapEl=document.getElementById('gap');
 if(order.length>1){
  const lead=order[0];
  const diff=Math.max(0,(lead.progress-p.progress));
  const gapSec=diff/((1/200)*2.4); // rough progress/sec at 200km/h
  const gtxt='+'+(gapSec).toFixed(2)+'s';
  gapEl.textContent=gtxt;
  // delta color: closing (p faster) green, opening red
  if(diff<lastPosGap||lastPosGap<0){gapEl.className='gap up';}else{gapEl.className='gap down';}
  lastPosGap=diff;
 } else {gapEl.textContent='+0.000s';gapEl.className='gap';}
 document.getElementById('tm').textContent=game.raceTime.toFixed(1);
 // sector color (purple = best, green = personal, white = default)
 const secEl=document.getElementById('sec');
 const secNum=getSector(p.progress);
 secEl.textContent='S'+secNum;
 secEl.className='sx s'+secNum;
 document.getElementById('secT').textContent=game.secT.toFixed(1);
 for(let i=1;i<=3;i++){const el=document.getElementById('s'+i+'t');const v=game.sectorTimes[i-1];el.textContent=v>0?v.toFixed(2):'—';el.parentElement.classList.toggle('active',i===game.sector&&game.sectorActive);}
 const pitEl=document.getElementById('pitHud');
 if(game.inPit){pitEl.textContent='⚠ PIT — MAX 60 km/h';}else{pitEl.textContent='';}
 const bestEl=document.getElementById('bestT');
 bestEl.textContent=game.best?'BEST '+game.best.toFixed(2)+'s':'BEST —';
 // Lifting Turn badge
 const badge=document.getElementById('liftBadge');
 if(badge){
  const braking=liftBrakeT>0;
  const on=braking||liftBoostT>0;
  badge.style.display=on?'block':'none';
  badge.className=braking?'in':'';
  badge.textContent=braking?'⚡ LIFT IN':'⚡ LIFT OK';
 }
}
function speedFx(on){const fx=document.getElementById('speedFx');if(!fx)return;fx.classList.toggle('lines',on&&game.raceTime%0.5<0.25);}
function updateCamera(dt){
 const p=game.player;if(!p)return;
 const pos=p.e.position.getValue();if(!pos)return;
 const dist=game.camMode==='車內'?10:95;
 const pitch=game.camMode==='車內'?-0.08:-0.35;
 // FOV scales with speed for sense of acceleration (wider at high speed)
 const baseFov=Math.PI/3;
 const targetFov=baseFov+Math.PI/180*Math.min(15,p.speed*0.075);
 const curFov=viewer.camera.frustum.fov;
 viewer.camera.frustum.fov=curFov+(targetFov-curFov)*Math.min(1,6*dt);
 // Subtle camera shake at high speed (above 80 km/h)
 const shakeAmp=p.speed>80?Math.min(0.004,(p.speed-80)*0.00006):0;
 const t=game.raceTime;
 const shakeH=Math.sin(t*47)*shakeAmp;
 const shakeP=Math.cos(t*53)*shakeAmp*0.6;
 const shakeD=Math.sin(t*61)*shakeAmp*10;
 viewer.camera.lookAt(pos,new Cesium.HeadingPitchRange(p.heading+Math.PI/2+shakeH,pitch+shakeP,dist+shakeD));
}
let lastT=performance.now();
function loop(){const n=performance.now();const dt=Math.min(0.05,(n-lastT)/1000);lastT=n;update(dt);requestAnimationFrame(loop);}
init();loop();
</script></body></html>
