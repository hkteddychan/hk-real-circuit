<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HK Real Circuit 3D｜Central・灣仔真實地貌</title><script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/cesium@1.116/Build/Cesium/Cesium.js';document.head.appendChild(s)})()"></script><link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui;background:#07111c}.panel{position:fixed;z-index:5;top:16px;left:16px;width:min(370px,calc(100vw - 32px));padding:18px;border:1px solid #52dcff88;border-radius:16px;background:#071526dd;color:#e9faff;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0008}.panel h1{margin:0;color:#72eaff;font-size:1.2rem}.panel p{font-size:.85rem;color:#b7d3dd;line-height:1.45}.status{margin:12px 0;padding:10px;border-radius:9px;background:#102c3a;color:#8ceeff;font-size:.8rem}.row{display:flex;gap:8px;margin-top:10px}button{flex:1;padding:10px;border:1px solid #42cfff77;border-radius:9px;background:#10314a;color:#e9faff;font-weight:700;cursor:pointer}button:hover{background:#17627d}.credit{font-size:.68rem;color:#8aaebb;margin-top:11px;line-height:1.35}.cesium-viewer-bottom{display:none}.racehud{position:fixed;z-index:6;right:16px;top:16px;display:none;padding:14px;border:1px solid #52dcff88;border-radius:12px;background:#071526dd;color:#e9faff;font-weight:700}.racehud b{color:#72eaff}.drive{position:fixed;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);display:none;gap:8px}.drive button{width:58px;height:48px}.devnote{color:#ffd27a;font-size:.72rem}</style></head><body><div id="cesiumContainer"></div><section class="panel"><h1>HK REAL CIRCUIT 3D</h1><p>真實香港地貌測試版｜Central・灣仔</p><div class="status" id="status">正在載入香港政府 3D Buildings / Infrastructure…</div><div class="row"><button id="central">Central</button><button id="wan">Wan Chai</button><button id="cb">Causeway Bay</button></div><div class="row"><button id="tilt">切換 3D 視角</button><button id="reset">重設視角</button></div><div class="row"><button id="race">開始駕駛</button><button id="stop">停止</button></div><div class="credit">資料：香港特別行政區政府地政總署 CSDI 3D Spatial Data API。呢個版本先驗證真實 3D 地貌及城市模型，賽車物理會接入下一版。</div></section><div class="racehud" id="racehud">SPEED <b id="spd">0</b> km/h<br>LAP <b id="lap">1/3</b> · <b id="place">TEST</b><br><span class="devnote">遊戲駕駛開發中</span></div><div class="drive" id="drive"><button id="left">◀</button><button id="gas">▲</button><button id="right">▶</button></div><script>
Cesium.Ion.defaultAccessToken='';const status=document.getElementById('status');const viewer=new Cesium.Viewer('cesiumContainer',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:true,infoBox:false,selectionIndicator:false,shouldAnimate:true});viewer.scene.globe.show=true;viewer.scene.globe.depthTestAgainstTerrain=false;const KEY='3967f8f365694e0798af3e7678509421';const base='https://data.map.gov.hk/api/3d-data/3dsd/WGS84/';let heading=0.02,pitch=-0.72,range=4300;async function add(url,label){try{const tiles=await Cesium.Cesium3DTileset.fromUrl(url);viewer.scene.primitives.add(tiles);status.textContent+=' '+label+' ✅';return tiles}catch(e){status.textContent+=' '+label+' ❌';console.error(e)}}async function init(){await Promise.all([add(base+'building/tileset.json?key='+KEY,'Buildings'),add(base+'infrastructure/tileset.json?key='+KEY,'Infrastructure')]);status.textContent='香港政府真實 3D 城市模型已載入 ✅';fly(114.1588,22.2816,range)}function fly(lon,lat,r=range){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,r),orientation:{heading,pitch,roll:0},duration:1.2})}const route=[[114.1588,22.2816],[114.1632,22.2805],[114.1685,22.2788],[114.1722,22.2769],[114.1770,22.2782],[114.1847,22.2800],[114.1815,22.2832],[114.1722,22.2769],[114.1650,22.2798],[114.1588,22.2816]];let car,drive=false,ri=0,progress=0,speed=0,keys={};function makeRace(){viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArray(route.flat()),width:5,material:Cesium.Color.CYAN.withAlpha(.75),clampToGround:true}});car=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(route[0][0],route[0][1],8),point:{pixelSize:18,color:Cesium.Color.ORANGE,outlineColor:Cesium.Color.WHITE,outlineWidth:2}})}function move(dt){if(!drive||!car)return;let gas=keys.ArrowUp||keys.w||keys.gas,turn=(keys.ArrowLeft||keys.a||keys.left?-1:0)+(keys.ArrowRight||keys.d||keys.right?1:0);speed=Math.max(0,Math.min(160,speed+(gas?55:-30)*dt));progress+=speed*dt/450;ri=Math.floor(progress)% (route.length-1);let f=progress%1,a=route[ri],b=route[ri+1];let lon=a[0]+(b[0]-a[0])*f+(turn*.00002),lat=a[1]+(b[1]-a[1])*f;car.position=Cesium.Cartesian3.fromDegrees(lon,lat,8);viewer.camera.lookAt(car.position,new Cesium.HeadingPitchRange(0,-.35,700));document.getElementById('spd').textContent=Math.round(speed);document.getElementById('lap').textContent=(Math.min(3,Math.floor(progress/(route.length-1))+1))+'/3'}let lastT=performance.now();function raceLoop(){let n=performance.now(),dt=Math.min(.05,(n-lastT)/1000);lastT=n;move(dt);requestAnimationFrame(raceLoop)}raceLoop();document.getElementById('race').onclick=()=>{makeRace();drive=true;document.getElementById('racehud').style.display='block';document.getElementById('drive').style.display='flex'};document.getElementById('stop').onclick=()=>{drive=false;document.getElementById('racehud').style.display='none';document.getElementById('drive').style.display='none';viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY)};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);['left','gas','right'].forEach(id=>{let b=document.getElementById(id);b.onpointerdown=()=>keys[id]=1;b.onpointerup=()=>keys[id]=0;b.onpointerleave=()=>keys[id]=0});document.getElementById('central').onclick=()=>fly(114.1588,22.2816,3500);document.getElementById('wan').onclick=()=>fly(114.1722,22.2769,3000);document.getElementById('cb').onclick=()=>fly(114.1847,22.2800,2600);document.getElementById('reset').onclick=()=>fly(114.1588,22.2816,4300);document.getElementById('tilt').onclick=()=>{pitch=pitch>-1?-1.15:-.72;fly(114.1588,22.2816,range)};init();</script></body></html>
